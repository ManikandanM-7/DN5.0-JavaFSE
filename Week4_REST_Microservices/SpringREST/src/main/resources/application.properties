spring.application.name=spring-rest-handson

# H2 Database
spring.datasource.url=jdbc:h2:mem:restdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080

# JWT
app.jwt.secret=cognizantDN5JavaFSEMaaniSecretKey2027MustBeAtLeast256BitsLongForHS256Algorithm
app.jwt.expiration-ms=3600000

# Actuator — expose health, info, metrics endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

logging.level.com.cognizant=DEBUG
